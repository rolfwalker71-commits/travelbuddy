name: Docker

# Baut das TravelBuddy-Image (Server + Web-Client) für x86 (linux/amd64) und veröffentlicht es nach ghcr.io.
# Pull Requests: testen und bauen. Push auf main und Tags v*: testen, bauen und veröffentlichen.
# Der Server holt das Image mit `docker compose pull && docker compose up -d` (siehe docs/DEPLOY.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "server/**"
      - "web/**"
      - "shared/**"
      - "VERSION"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "server/**"
      - "web/**"
      - "shared/**"
      - "VERSION"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      - name: Server (Typecheck und Tests)
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Web (Typecheck, Tests und Build)
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Anmeldung bei ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauzeitpunkt
        run: echo "BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - name: Bauen (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILT_AT=${{ env.BUILT_AT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
